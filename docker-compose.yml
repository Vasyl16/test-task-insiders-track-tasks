services:
  # Optional local Postgres - not started by a plain `docker-compose up`.
  # Use it only if you want a fully local DB instead of a remote one
  # (Neon/Supabase/etc.):
  #   1. docker-compose --profile local-db up --build
  #   2. backend/.env's DATABASE_URL must point at this service by name:
  #      postgresql://postgres:postgres@postgres:5432/task_tracker?schema=public
  # If DATABASE_URL already points at a remote DB, just run
  # `docker-compose up --build` as usual and this service stays off.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_tracker
    ports:
      # Host side only - 5432 collides with a locally-installed Postgres on
      # plenty of dev machines. Containers still reach this one at
      # postgres:5432 over the compose network regardless of this mapping.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Pulls PORT/DATABASE_URL/CORS_ORIGIN/JWT_*/EMAIL_* straight from your
    # real backend/.env - same file `npm run start:dev` already reads
    # outside Docker, so there's only one place to keep these in sync.
    env_file:
      - ./backend/.env
    # Generates the client (can't happen at image-build time - prisma.config.ts
    # resolves DATABASE_URL eagerly, which only exists once the container is
    # actually running), applies any pending migrations against whatever
    # DATABASE_URL points at, then starts the same watch-mode dev server
    # used outside Docker.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      # Named volume shadows the bind mount so the image's own
      # (container-platform) node_modules survives, instead of the bind
      # mount hiding it behind whatever (or nothing) is on the host.
      - backend_node_modules:/app/node_modules

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # VITE_API_URL is read by the browser, not the container, so
    # frontend/.env's http://localhost:3000/api (the host-published backend
    # port) is already correct as-is.
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
